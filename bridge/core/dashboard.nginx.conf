# Tiny nginx config for the Synaptic dashboard service.
# Serves the project tree as static files on port 80 (mapped to 8765 host-side).
# Mirrors what serve.py does on a developer's machine.
#
# Important: the `types` directive in nginx is REPLACING (not extending) when
# specified at server/location scope, so we can't just add `.mjs`/`.ply` here.
# Instead we keep nginx's HTTP-level `include /etc/nginx/mime.types;` (which
# already covers .html, .css, .js, .json, .mjs since nginx 1.21, .png, etc.)
# and pin `default_type` to octet-stream so unknown files like `.ply` come
# through as binary (matching serve.py's QuietHandler.extensions_map).

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;

    # Unknown extensions (.ply, etc.) are binary blobs — Three.js loaders
    # expect to fetch them as bytes, so this is the right default.
    default_type application/octet-stream;

    # Quiet logs — only log errors. Reduce noise for a desktop-style use case.
    access_log off;
    error_log  /var/log/nginx/error.log warn;

    # No caching — this is a live dashboard; source files change and we want
    # fresh JSON / JS every time.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # Allow the dashboard JS to fetch assets cross-origin if the user happens
    # to host the page on a different origin later.
    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Health-check endpoint so docker / orchestrators can probe the dashboard
    # service without hitting index.html (which loads heavy JS).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
